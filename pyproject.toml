[project]
name = "nodc-dyntaxa"
version = "0.2.0"
description = "Find taxon ID from dyntaxa"
authors = [
    {name = "Magnus Wenzer", email = "magnus.wenzer@smhi.se"},
]
dependencies = [
    "requests>=2.31.0",
    "polars>=1.26.0",
    "nodc-config",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mypkg = ["."]

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "F",  # pyflakes
    "E", # pycodestyle: error
    "W",  # pycodestyle: warning
    "I",  # isort: unsorted-imports
    "RUF"  # Ruff-specific rules
]

[tool.uv.sources]
nodc-config = { git = "https://github.com/nodc-sweden/nodc-config.git", rev = "v0.1.0" }

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]
